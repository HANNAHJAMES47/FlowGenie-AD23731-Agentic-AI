  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Lens Story Co. Visuals</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">2 Senior Candid Photographers • Traditional HD Video • Premium Coffee Table Album</text>
