      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#p2_bg)"/>
  
  <!-- Candid Portrait Photography Framing -->
  <rect x="220" y="80" width="360" height="240" rx="14" fill="#18181b" stroke="#f59e0b" stroke-width="3"/>
