<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="v1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="chandelier_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#v1_bg)"/>
  
  <!-- Architectural Pillars & Royal Arches -->
  <path d="M60 400 L60 140 Q160 80 260 140 L260 400 Z" fill="#3730a3" opacity="0.6"/>
  <path d="M540 400 L540 140 Q640 80 740 140 L740 400 Z" fill="#3730a3" opacity="0.6"/>
  <path d="M220 400 L220 100 Q400 30 580 100 L580 400 Z" fill="#4338ca" opacity="0.7"/>
  
