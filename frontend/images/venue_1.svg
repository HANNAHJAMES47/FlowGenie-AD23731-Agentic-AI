  <rect x="0" y="365" width="800" height="85" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">The Grand Orchid Convention Centre</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">500+ Seating Capacity • Pillarless AC Grand Ballroom • Valet Parking</text>
