  <path d="M400 20 L400 80 M340 80 L460 80 M300 110 Q400 150 500 110 M330 140 Q400 170 470 140 M370 165 L430 165 M400 165 L400 195" stroke="#fde047" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="300" cy="110" r="7" fill="#fef08a"/>
  <circle cx="500" cy="110" r="7" fill="#fef08a"/>
  <circle cx="330" cy="140" r="6" fill="#fef08a"/>
  <circle cx="470" cy="140" r="6" fill="#fef08a"/>
  <circle cx="400" cy="205" r="9" fill="#f59e0b"/>
  
