  <g fill="#fef08a" opacity="0.8">
    <circle cx="120" cy="80" r="4"/><circle cx="180" cy="60" r="3"/><circle cx="240" cy="90" r="5"/>
    <circle cx="680" cy="80" r="4"/><circle cx="620" cy="60" r="3"/><circle cx="560" cy="90" r="5"/>
  </g>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="180" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="1">🏛️ LUXURY CONVENTION</text>
  
