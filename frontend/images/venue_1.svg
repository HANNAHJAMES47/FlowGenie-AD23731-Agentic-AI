  <path d="M240 350 Q400 330 560 350 L580 400 L220 400 Z" fill="#f8fafc" opacity="0.95"/>
  <rect x="290" y="320" width="220" height="30" rx="4" fill="url(#gold)"/>
  <circle cx="400" cy="305" r="15" fill="#f43f5e"/>
  
