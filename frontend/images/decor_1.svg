<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="d1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="floral_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#d1_bg)"/>
  
  <!-- Floral Arch / Mandap Canopy -->
  <circle cx="400" cy="180" r="150" fill="url(#floral_glow)"/>
  <path d="M180 380 Q180 100 400 100 Q620 100 620 380" stroke="#f43f5e" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M200 380 Q200 120 400 120 Q600 120 600 380" stroke="#fb7185" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Exotic Flowers (Roses, Orchids, Lilies) -->
  <g fill="#ffe4e6">
    <circle cx="280" cy="140" r="14"/><circle cx="340" cy="110" r="16"/><circle cx="400" cy="100" r="20"/>
    <circle cx="460" cy="110" r="16"/><circle cx="520" cy="140" r="14"/>
  </g>
  <g fill="#f43f5e">
    <circle cx="280" cy="140" r="8"/><circle cx="340" cy="110" r="9"/><circle cx="400" cy="100" r="12"/>
    <circle cx="460" cy="110" r="9"/><circle cx="520" cy="140" r="8"/>
  </g>
  
  <!-- Hanging Crystal Drop Strands -->
  <line x1="320" y1="130" x2="320" y2="240" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4,6"/>
  <line x1="400" y1="120" x2="400" y2="260" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4,6"/>
  <line x1="480" y1="130" x2="480" y2="240" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4,6"/>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="180" height="32" rx="8" fill="rgba(76, 5, 25, 0.85)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#fecdd3" letter-spacing="1">🌸 FLORAL MANDAP</text>
  
  <!-- Bottom Overlay Bar -->
  <rect x="0" y="365" width="800" height="85" fill="rgba(76, 5, 25, 0.9)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Bloom Atelier Floral Designers</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Exotic Orchid & Rose Stage Arch • Fairy Light Tunnel • Couple Photobooth</text>
</svg>