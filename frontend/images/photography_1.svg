<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="flash_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#p1_bg)"/>
  
  <!-- Pro Cinema Camera & Lens Aperture -->
  <circle cx="400" cy="180" r="160" fill="url(#flash_glow)"/>
  <rect x="260" y="100" width="280" height="180" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="400" cy="190" r="64" fill="#0f172a" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="400" cy="190" r="40" fill="#0891b2" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="380" cy="170" r="10" fill="#ffffff"/>
  
  <!-- Camera Shutter Button & Flash Head -->
  <rect x="300" y="80" width="50" height="20" rx="4" fill="#ef4444"/>
  <rect x="440" y="70" width="70" height="30" rx="6" fill="#facc15"/>
  
  <!-- Cinematic Film Strip Border Lines -->
  <g fill="#0284c7" opacity="0.3">
    <rect x="40" y="30" width="20" height="15" rx="2"/><rect x="70" y="30" width="20" height="15" rx="2"/>
    <rect x="100" y="30" width="20" height="15" rx="2"/><rect x="700" y="30" width="20" height="15" rx="2"/>
    <rect x="730" y="30" width="20" height="15" rx="2"/><rect x="760" y="30" width="20" height="15" rx="2"/>
  </g>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="180" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="1">📸 4K CINEMATOGRAPHY</text>
  
  <!-- Bottom Overlay Bar -->
  <rect x="0" y="365" width="800" height="85" fill="rgba(15, 23, 42, 0.9)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Eternal Frames Cinema & Stills</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Traditional + Candid Stills • 4K Drone Aerial Shoots • Cinematic Wedding Teaser</text>
</svg>