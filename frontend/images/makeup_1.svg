<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="m1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500724"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="mirror_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#m1_bg)"/>
  
  <!-- Glowing Hollywood Vanity Mirror & Brushes -->
  <circle cx="400" cy="180" r="140" fill="url(#mirror_glow)"/>
  <circle cx="400" cy="180" r="100" fill="#fdf2f8" stroke="#f472b6" stroke-width="4"/>
  
  <!-- Hollywood Bulbs around mirror -->
  <g fill="#fef08a">
    <circle cx="300" cy="180" r="10"/><circle cx="500" cy="180" r="10"/><circle cx="400" cy="80" r="10"/>
    <circle cx="330" cy="110" r="10"/><circle cx="470" cy="110" r="10"/>
  </g>
  
  <!-- Luxury Lipsticks & Airbrush Guns -->
  <rect x="230" y="270" width="30" height="70" rx="4" fill="#0f172a"/>
  <polygon points="230,270 260,270 245,230" fill="#e11d48"/>
  <rect x="540" y="270" width="30" height="70" rx="4" fill="#0f172a"/>
  <polygon points="540,270 570,270 555,230" fill="#be185d"/>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="180" height="32" rx="8" fill="rgba(80, 7, 36, 0.85)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbcfe8" letter-spacing="1">💄 HD AIRBRUSH BRIDAL</text>
  
  <!-- Bottom Overlay Bar -->
  <rect x="0" y="365" width="800" height="85" fill="rgba(80, 7, 36, 0.9)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Glow Atelier Bridal Artistry</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">16-Hour Long Stay HD Airbrush Makeup • Luxury Hair Extensions • Saree Draping</text>
</svg>