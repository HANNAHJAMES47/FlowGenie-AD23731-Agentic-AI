<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="e2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#e2_bg)"/>
  
  <!-- DJ Console & Turntables & Laser Beams -->
  <polygon points="400,0 200,360 260,360" fill="rgba(244, 63, 94, 0.4)"/>
  <polygon points="400,0 540,360 600,360" fill="rgba(56, 189, 248, 0.4)"/>
  
  <!-- DJ Console Desk -->
  <rect x="220" y="240" width="360" height="100" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="300" cy="280" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="500" cy="280" r="30" fill="#0f172a" stroke="#f43f5e" stroke-width="4"/>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="180" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#fda4af" letter-spacing="1">🎧 CELEBRITY DJ</text>
  
  <!-- Bottom Overlay Bar -->
  <rect x="0" y="365" width="800" height="85" fill="rgba(15, 23, 42, 0.9)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">DJ Spotlight & Intelligent Light Show</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Bollywood, Punjabi & EDM Sets • Moving Head Lasers & CO2 Cold Pyros</text>
</svg>