<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="v3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sky_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#v3_bg)"/>
  
  <!-- Modern Glasshouse Skyline -->
  <rect x="80" y="160" width="640" height="220" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="380" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="160" x2="400" y2="380" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="560" y1="160" x2="560" y2="380" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  
  <!-- City Skyline Silhouette -->
  <path d="M120 280 L160 280 L160 220 L200 220 L200 280 L280 280 L280 190 L330 190 L330 280 L440 280 L440 240 L500 240 L500 280 L620 280 L620 210 L680 210 L680 280 Z" fill="#0284c7" opacity="0.3"/>
  
  <!-- Warm Lounge Seating -->
  <rect x="280" y="320" width="240" height="40" rx="8" fill="#e2e8f0"/>
  <circle cx="340" cy="305" r="14" fill="#f43f5e"/>
  <circle cx="460" cy="305" r="14" fill="#3b82f6"/>
  
  <!-- Top Category Badge -->
  <rect x="24" y="24" width="190" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="1">🌆 SKYLINE TERRACE</text>
  
  <!-- Bottom Overlay Bar -->
  <rect x="0" y="365" width="800" height="85" fill="rgba(15, 23, 42, 0.9)"/>
  <text x="30" y="402" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Skyline Panorama Terrace & Glasshouse</text>
  <text x="30" y="426" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Panoramic City Views • Sunset Cocktail Terrace • 350 Capacity</text>
